<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Nền trắng tinh tế bo góc nhẹ chuẩn avatar app -->
  <rect width="512" height="512" rx="64" fill="url(#bgLight)"/>
  <rect width="510" height="510" x="1" y="1" rx="63" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Biểu tượng số 11 thể thao đen tuyền -->
  <g transform="translate(256, 195) scale(0.95)">
    <!-- Vạch số 1 bên trái -->
    <path d="M -75 -65 L -35 -65 L -65 65 L -105 65 Z" fill="#0A0A0A"/>
    <!-- Vạch số 1 bên phải -->
    <path d="M -15 -65 L 25 -65 L -5 65 L -45 65 Z" fill="#0A0A0A"/>
    <!-- Điểm nhấn vát thể thao -->
    <polygon points="45,-65 85,-65 70,0 30,0" fill="#0A0A0A"/>
    <polygon points="50,20 90,20 80,65 40,65" fill="#334155"/>
  </g>

  <!-- Typography 11SPORT đen đậm mạnh mẽ -->
  <text x="256" y="340" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Arial Black', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#0A0A0A">11SPORT</text>

  <!-- Tagline định vị thương hiệu -->
  <text x="256" y="380" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" 
        font-size="13" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#64748B">PICKLEBALL &amp; MORE</text>

  <!-- Đường gạch chân thể thao tinh tế -->
  <rect x="206" y="405" width="100" height="3" rx="1.5" fill="#0A0A0A"/>
</svg>
