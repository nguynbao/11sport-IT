<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1412"/>
      <stop offset="100%" stop-color="#050706"/>
    </linearGradient>
  </defs>

  <!-- Nền đen sang trọng bo góc nhẹ chuẩn avatar app -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="63" fill="none" stroke="#26302B" stroke-width="2"/>

  <!-- Biểu tượng số 11 thể thao cách điệu tốc độ -->
  <g transform="translate(256, 195) scale(0.95)">
    <!-- Vạch số 1 bên trái -->
    <path d="M -75 -65 L -35 -65 L -65 65 L -105 65 Z" fill="#FFFFFF"/>
    <!-- Vạch số 1 bên phải với đường vát thể thao -->
    <path d="M -15 -65 L 25 -65 L -5 65 L -45 65 Z" fill="#FFFFFF"/>
    <!-- Điểm nhấn phụ mang tính khí động học (Aerodynamic notch) -->
    <polygon points="45,-65 85,-65 70,0 30,0" fill="#FFFFFF"/>
    <polygon points="50,20 90,20 80,65 40,65" fill="#E2E8F0"/>
  </g>

  <!-- Typography 11SPORT trắng đen hiện đại -->
  <text x="256" y="340" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Arial Black', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#FFFFFF">11SPORT</text>

  <!-- Tagline định vị thương hiệu -->
  <text x="256" y="380" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" 
        font-size="13" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#8E9B95">PICKLEBALL &amp; MORE</text>

  <!-- Đường gạch chân thể thao tinh tế -->
  <rect x="206" y="405" width="100" height="3" rx="1.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
